[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "calfire-wildfires"
description = "Download wildfire incidents from CAL FIRE"
keywords = ["wildfires", "calfire", "california", "geojson", "data"]
readme = "README.md"
authors = [
    {name = "Ben Welsh", email = "b@palewi.re"},
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = ["requests", "click"]
dynamic = ["version"]

[project.urls]
Documentation = "https://palewi.re/docs/calfire-wildfires/"
Source = "https://github.com/datadesk/calfire-wildfires"
Issues = "https://github.com/datadesk/calfire-wildfires/issues"

[project.scripts]
calfirewildfires = "calfire_wildfires.cli:cmd"

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "setuptools-scm",
    "twine",
    "ty",
]
test = [
    "pytest",
    "pytest-cov",
]
docs = [
    "myst-parser",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-palewire-theme",
]

[tool.setuptools]
packages = ["calfire_wildfires"]

[tool.setuptools.package-data]
calfire_wildfires = ["py.typed"]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not live"]
markers = [
    "live: talks to the real CAL FIRE website, so it can be slow or fail when CAL FIRE is down",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["calfire_wildfires"]

[tool.coverage.run]
source = ["calfire_wildfires"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
    "if __name__ == .__main__.:",
]
